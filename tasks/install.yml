- name: Make sure snapd is installed
  package:
    name:
      - snapd
    state: latest
  become: yes
  when: ansible_distribution != 'Archlinux'

- name: Make sure snapd is installed
  pacman:
    name:
      - snapd
    state: present
  become: yes
  when: ansible_distribution == 'Archlinux'

- name: Check if is raspberry
  shell: "uname -r"
  register: uname

- name: Gather available packages to check for linux-modules-extra-raspi
  package_facts:
    manager: apt
  when:
    # '"raspi" in uname.stdout' rather than 'uname.stdout | regex_search(...)':
    # regex_search returns None when it does not match, and ansible-core 2.19+
    # rejects a conditional that does not evaluate to a boolean, so the regex
    # form fails the play on every non-Pi host.
    - "'raspi' in uname.stdout"
    - ansible_facts.os_family == 'Debian'

- name: Install raspberry specific packages
  package:
    name:
      - linux-modules-extra-raspi
    state: latest
  when:
    - "'raspi' in uname.stdout"
    # linux-modules-extra-raspi was removed in Ubuntu 24.04 (noble): kernel
    # modules are zstd-compressed, so the split into a separate -extra package
    # was dropped and everything is now in linux-modules. See
    # https://bugs.launchpad.net/ubuntu/+bug/2048862. Installing it on 24.04 or
    # later fails with:
    #   "No package matching 'linux-modules-extra-raspi' is available"
    # which aborts the play before microk8s is installed. It is also no longer
    # needed - the modules are in the standard arm64 kernel.
    - ansible_facts.os_family == 'Debian'
    - "'linux-modules-extra-raspi' in ansible_facts.packages | default([])"

- name: Install microk8s
  become: yes
  snap:
    name: microk8s
    classic: yes
    channel: "{{ microk8s_version }}"

- name: Wait for microk8s to be ready
  become: yes
  command: "{{ microk8s_bin_path }}microk8s.status --wait-ready"
  changed_when: false
  register: mk8sstatusout
  failed_when:
      - "'This MicroK8s deployment is acting as a node in a cluster.' not in mk8sstatusout.stdout_lines"
      - mk8sstatusout.rc > 0


- name: Create kubectl alias
  become: yes
  command: "snap alias microk8s.kubectl kubectl"
  changed_when: false
  register: aliaskubectlout

- name: Create helm3 alias
  become: yes
  command: "snap alias microk8s.helm3 helm"
  changed_when: false
  register: aliashelmout
  when:
    - "'helm3' in microk8s_plugins"
    - microk8s_plugins.helm3

- name: Create custom certificates
  become: yes
  ansible.builtin.template:
    src: "{{ microk8s_csr_template }}"
    dest: /var/snap/microk8s/current/certs/csr.conf.template
    mode: 0644
  when: microk8s_csr_template is defined and microk8s_csr_template is file
  notify:
  - Refresh certs

- name: Create folder for microk8s certificates
  become: yes
  file:
    path: /usr/share/ca-certificates/extra
    state: directory
    mode: 0755

- name: Copy certificates
  become: yes
  copy:
    src: "{{ item }}"
    dest: /usr/share/ca-certificates/extra
    remote_src: yes
    force: yes
    mode: 0644
  with_fileglob:
    - /var/snap/microk8s/current/certs/*ca*.crt

- name: Trust certificates generated by microk8s
  become: yes
  command: "update-ca-certificates"
  register: command_result
  changed_when: "'0 added, 0 removed' not in command_result.stdout"

- name: Disable snap autoupdate
  become: true
  blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED: microk8s Disable snap autoupdate"
    content: |
      127.0.0.1 api.snapcraft.io
  when: microk8s_disable_snap_autoupdate
